<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galeri Risol Gurih - Website UMKM</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#konten">Lewati ke konten utama</a>

    <header class="site-header">
      <nav class="nav" aria-label="Navigasi utama">
        <a class="brand" href="index.html">Risol Gurih</a>
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="tentang.html">Tentang Kami</a></li>
          <li><a href="produk.html">Produk</a></li>
          <li><a aria-current="page" href="galeri.html">Galeri</a></li>
        </ul>
      </nav>
    </header>

    <main id="konten" class="page">
      <h1>Galeri Risol Gurih</h1>

      <section aria-labelledby="media-title">
        <h2 id="media-title">Media Usaha</h2>

        <div class="gallery-list">
          <figure class="media-card">
            <img
              src="assets/images/macam-risol.png"
              alt="Etalase produk Risol Gurih"
            />
            <figcaption>Berbagai varian Risol Gurih.</figcaption>
          </figure>

          <figure class="media-card">
            <img
              src="assets/images/proses-risol.jpeg"
              alt="Ilustrasi proses pembuatan risol"
            />
            <figcaption>Proses pembuatan produk risol.</figcaption>
          </figure>
        </div>
      </section>

    <section aria-labelledby="audio-title">
      <h2 id="audio-title">Nikmati Momen Bersama Risol Gurih</h2>
      <p id="audio-note">
        Nada uji singkat memastikan elemen audio dan kontrol browser dapat diperiksa.
      </p>
     <audio
      controls
      aria-describedby="audio-note"
      src="assets/audio/audio-risol.mp3"
    >
      Browser Anda tidak mendukung pemutar audio.
    </audio>
    </section>

    </main>

    <footer class="site-footer">
      <p>&copy; by Meylicious. Data pada halaman ini bersifat dummy.</p>
    </footer>
  </body>
</html>
